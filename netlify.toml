[build]
  publish = "public"
  functions = "netlify/functions"

# API: all /api/* traffic rewrites to the single api function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Public creator profiles: /c/* is served by the api function
# (seg "cpage") so approved, profile-complete creators get real
# title/meta/OG tags and indexability in the served HTML
# (Jeff's ruling, 2026-10-23). Everyone else gets the plain app
# shell back from the same function, so the SPA behaves as before.
[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/api/cpage/:splat"
  status = 200

# SPA fallback: every other route serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# Perf (2026-10-28): static assets used to ship with Netlify's
# default Cache-Control (max-age=0, must-revalidate), so browsers
# revalidated every file on every app load. App code/CSS now cache
# for an hour with stale-while-revalidate (deploys still propagate
# within the hour); brand assets and the bundled dataset cache for
# a day. index.html and /api/* are deliberately not covered here.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/theme-v2.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
