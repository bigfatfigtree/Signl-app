[build]
  publish = "public"
  functions = "netlify/functions"

# API: all /api/* traffic rewrites to the single api function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: every other route serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
